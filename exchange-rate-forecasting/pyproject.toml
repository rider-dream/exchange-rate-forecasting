[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fx-forecaster"
version = "0.1.0"
description = "Leakage-safe exchange-rate forecasting with macroeconomic and market variables"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Project Author"}]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "matplotlib>=3.9",
  "joblib>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[project.scripts]
fx-forecast = "fx_forecaster.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
